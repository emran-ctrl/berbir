id: debug-endpoint-exposure
info:
  name: Debug or Internal Endpoint Exposed
  severity: medium
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/debug"
      - "{{BaseURL}}/debug"
      - "{{BaseURL}}/actuator"
      - "{{BaseURL}}/actuator/env"
    matchers:
      - type: word
        part: body
        words:
          - "Stack trace"
          - "Exception in thread"
          - "Traceback (most recent call last)"
          - "spring.application"
          - "DB_PASSWORD"
